<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>vSWAF Mission Board</title>
<style>
  html,body{margin:0;height:100%;background:#0B2545;color:#fff;font-family:"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-app-region:drag;overflow:hidden}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  svg{width:150px;height:150px;overflow:visible;filter:drop-shadow(0 8px 22px rgba(0,0,0,.35))}

  /* 1. The blue disc grows in */
  .disc{transform-origin:20px 20px;animation:disc .55s cubic-bezier(.2,.9,.3,1.2) both}
  /* 2. The gold ring draws itself around it */
  .ring{fill:none;stroke:#FCD116;stroke-width:3.4;stroke-dasharray:115;stroke-dashoffset:115;
        transform:rotate(-90deg);transform-origin:20px 20px;animation:draw .7s .15s ease-out forwards}
  /* 3. The three crowns drop in, one after another */
  .crown{fill:#FCD116;opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:crown .45s cubic-bezier(.2,.9,.3,1.35) forwards}
  .c1{animation-delay:.7s} .c2{animation-delay:.85s} .c3{animation-delay:1s}
  /* 4. A shine sweeps across */
  .shine{transform:translateX(-60px) skewX(-20deg);animation:shine .8s 1.35s ease-in-out forwards}
  /* 5. Title and text */
  h1{margin:6px 0 0;font-size:28px;font-weight:700;letter-spacing:.3px;opacity:0;animation:up .5s 1.25s ease-out forwards}
  p{margin:0;color:#B9C7DA;font-size:14px;opacity:0;animation:up .5s 1.5s ease-out forwards}
  .dot{animation:dot 1.2s 2s infinite both} .dot:nth-child(2){animation-delay:2.2s} .dot:nth-child(3){animation-delay:2.4s}

  @keyframes disc{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes crown{from{opacity:0;transform:translateY(-6px) scale(.6)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes shine{to{transform:translateX(60px) skewX(-20deg)}}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes dot{0%,100%{opacity:.25}40%{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    .disc,.ring,.crown,.shine,h1,p,.dot{animation:none;opacity:1;stroke-dashoffset:0}
    .shine{display:none}
  }
</style></head>
<body><div class="wrap" role="status" aria-label="Loading vSWAF Mission Board">
  <svg viewBox="0 0 40 40" aria-hidden="true">
    <defs>
      <clipPath id="clip"><circle cx="20" cy="20" r="16.6"/></clipPath>
      <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    </defs>
    <circle class="disc" cx="20" cy="20" r="16.6" fill="#005B99"/>
    <circle class="ring" cx="20" cy="20" r="18.3"/>
    <path class="crown c1" d="M8.10 13.40 L11.00 15.30 L13.10 13.40 L15.20 15.30 L18.10 13.40 L16.50 19.70 L9.70 19.70 Z"/>
    <path class="crown c2" d="M21.90 13.40 L24.80 15.30 L26.90 13.40 L29.00 15.30 L31.90 13.40 L30.30 19.70 L23.50 19.70 Z"/>
    <path class="crown c3" d="M15.00 23.90 L17.90 25.80 L20.00 23.90 L22.10 25.80 L25.00 23.90 L23.40 30.20 L16.60 30.20 Z"/>
    <g clip-path="url(#clip)"><rect class="shine" x="10" y="0" width="12" height="40" fill="url(#sh)"/></g>
  </svg>
  <h1>vSWAF Mission Board</h1>
  <p>Loading missions<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></p>
</div>
</body></html>
