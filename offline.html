<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>vSWAF Mission Board</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center; background:#0B2545; color:#fff; font-family: Segoe UI, system-ui, sans-serif; }
  .box { max-width:460px; text-align:center; display:flex; flex-direction:column; gap:16px; align-items:center; padding:24px; }
  h1 { margin:0; font-size:26px; }
  p { margin:0; color:#D6E0EC; line-height:1.5; }
  a { display:inline-flex; align-items:center; height:46px; padding:0 26px; border-radius:10px; background:#FECC02; color:#0B2545; font-weight:700; text-decoration:none; }
</style>
</head>
<body>
<div class="box">
  <svg width="72" height="72" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#FCD116"/><circle cx="20" cy="20" r="16.6" fill="#005B99"/><path d="M8.10 13.40 L11.00 15.30 L13.10 13.40 L15.20 15.30 L18.10 13.40 L16.50 19.70 L9.70 19.70 Z M21.90 13.40 L24.80 15.30 L26.90 13.40 L29.00 15.30 L31.90 13.40 L30.30 19.70 L23.50 19.70 Z M15.00 23.90 L17.90 25.80 L20.00 23.90 L22.10 25.80 L25.00 23.90 L23.40 30.20 L16.60 30.20 Z" fill="#FCD116"/></svg>
  <h1>vSWAF Mission Board</h1>
  <p id="msg">Can't reach the mission board. Check your internet connection and try again.</p>
  <a href="app://retry/">Try again</a>
</div>
<script>
  if (new URLSearchParams(location.search).get('reason') === 'nourl') {
    document.getElementById('msg').textContent = 'This copy of the app has no web app link set. Ask your vSWAF admin for an updated version.';
  }
</script>
</body>
</html>
